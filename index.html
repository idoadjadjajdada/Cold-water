<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Coldwater">
<meta name="theme-color" content="#251F52">
<link rel="apple-touch-icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 180 180'%3E%3Crect width='180' height='180' rx='40' fill='%23251F52'/%3E%3Crect x='42' y='34' width='96' height='112' rx='14' fill='%237CE0C3'/%3E%3Crect x='54' y='50' width='72' height='16' rx='6' fill='%23146151'/%3E%3Crect x='54' y='74' width='72' height='16' rx='6' fill='%23146151'/%3E%3Crect x='54' y='98' width='72' height='16' rx='6' fill='%23146151'/%3E%3Ccircle cx='118' cy='58' r='4' fill='%23FFE66D'/%3E%3Ccircle cx='118' cy='82' r='4' fill='%23FFE66D'/%3E%3C/svg%3E">
<title>Coldwater</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#251F52; --bg2:#191339;
    --floor:#3B3276; --floor2:#312A66;
    --tile:#4A3F8A; --tile-lip:#6152B4;
    --ink:#160F3B; --paper:#F6F2FF;
    --mint:#7CE0C3; --sky:#8FC4FF; --butter:#FFD166;
    --lilac:#C7A8FF; --coral:#FF7A59; --cash:#FFE66D; --danger:#FF5C7A;
    --pink:#FF9ECF;
    --r:16px; --ts:64px;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;-webkit-touch-callout:none;}
  html,body{height:100%;margin:0;overflow:hidden;}
  body{
    background:radial-gradient(130% 100% at 50% -10%, #3A3180 0%, var(--bg) 46%, var(--bg2) 100%);
    color:var(--paper);
    font-family:'Fredoka', ui-rounded, -apple-system, system-ui, sans-serif;
    font-weight:500; -webkit-user-select:none; user-select:none;
    touch-action:manipulation; overscroll-behavior:none;
  }
  button{font-family:inherit;font-weight:600;border:0;background:none;color:inherit;cursor:pointer;touch-action:manipulation;}
  .num{font-variant-numeric:tabular-nums;}

  #app{position:fixed;inset:0;display:flex;flex-direction:column;gap:9px;
    padding:calc(env(safe-area-inset-top) + 9px) calc(env(safe-area-inset-right) + 11px) calc(env(safe-area-inset-bottom) + 9px) calc(env(safe-area-inset-left) + 11px);}

  /* ---------- header ---------- */
  header{display:flex;align-items:center;gap:9px;flex:0 0 auto;}
  .wallet{display:flex;align-items:baseline;gap:7px;background:rgba(0,0,0,.3);border-radius:999px;padding:8px 17px;
    box-shadow:inset 0 2px 0 rgba(255,255,255,.08);position:relative;}
  .wallet .amt{font-size:26px;font-weight:700;color:var(--cash);line-height:1;}
  .wallet .rate{font-size:12px;opacity:.55;}
  .wallet.bump{animation:bump .25s;}
  @keyframes bump{40%{transform:scale(1.06);}}
  .meters{display:flex;gap:8px;flex:1;min-width:0;}
  .meter{flex:1;min-width:0;background:rgba(0,0,0,.3);border-radius:14px;padding:7px 12px;box-shadow:inset 0 2px 0 rgba(255,255,255,.07);
    position:relative;overflow:hidden;}
  .meter .top{display:flex;justify-content:space-between;align-items:baseline;gap:8px;flex-wrap:nowrap;}
  /* Both of these must stay on one line: a wrapped "31 / 44 kW" used to push the
     header to three rows and squash the floor. */
  .meter .name{font-size:10.5px;letter-spacing:.1em;text-transform:uppercase;opacity:.5;
    white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0;}
  .meter .val{font-size:13px;font-weight:600;white-space:nowrap;flex:0 0 auto;}
  .bar{height:8px;border-radius:99px;background:rgba(0,0,0,.4);margin-top:6px;overflow:hidden;}
  .bar i{display:block;height:100%;border-radius:99px;transition:width .2s linear,background .3s;}
  .meter.warn{box-shadow:inset 0 2px 0 rgba(255,255,255,.07),0 0 0 2px var(--danger);animation:warnp 1.1s infinite;}
  @keyframes warnp{50%{box-shadow:inset 0 2px 0 rgba(255,255,255,.07),0 0 0 2px rgba(255,92,122,.25);}}
  .shopbtn{flex:0 0 auto;background:var(--lilac);color:var(--ink);border-radius:16px;padding:12px 17px;font-size:16px;font-weight:700;
    box-shadow:0 5px 0 #9878DF;display:flex;align-items:center;gap:8px;}
  .shopbtn:active{transform:translateY(3px);box-shadow:0 2px 0 #9878DF;}
  .shopbtn .dot{width:9px;height:9px;border-radius:99px;background:var(--ink);opacity:0;}
  .shopbtn.has .dot{opacity:1;animation:blip 1.1s infinite;}
  @keyframes blip{50%{opacity:.2;}}

  /* ---------- floor ---------- */
  main{flex:1;min-height:0;display:flex;flex-direction:column;gap:7px;}
  .stage{flex:1;min-height:0;display:flex;align-items:center;justify-content:center;position:relative;}
  #floor{position:relative;}
  .hallgrid{display:none;gap:9px;padding:15px;border-radius:28px;position:relative;z-index:1;
    background:
      repeating-linear-gradient(0deg, rgba(0,0,0,.10) 0 1px, transparent 1px 26px),
      repeating-linear-gradient(90deg, rgba(0,0,0,.10) 0 1px, transparent 1px 26px),
      linear-gradient(175deg,var(--floor),var(--floor2));
    box-shadow:inset 0 3px 0 rgba(255,255,255,.1), inset 0 -10px 24px rgba(0,0,0,.25), 0 22px 45px rgba(0,0,0,.4);}
  .hallgrid.on{display:grid;animation:hallin .24s ease-out;}
  @keyframes hallin{from{transform:translateX(14px) scale(.97);opacity:0;}}
  .hallgrid::after{content:'';position:absolute;inset:0;border-radius:28px;pointer-events:none;
    box-shadow:inset 0 0 60px rgba(0,0,0,.28);}

  /* the halls you are not standing in, stacked behind the one you are */
  .ghost{position:absolute;inset:0;border-radius:28px;pointer-events:none;opacity:0;z-index:0;
    background:linear-gradient(175deg,var(--floor),var(--floor2));
    box-shadow:0 16px 32px rgba(0,0,0,.34), inset 0 2px 0 rgba(255,255,255,.06);
    transition:opacity .25s;}
  .ghost.g1{transform:translate(18px,16px) scale(.955);}
  .ghost.g2{transform:translate(33px,29px) scale(.915);}
  .ghost.g1.on{opacity:.62;} .ghost.g2.on{opacity:.33;}

  .halls{flex:0 0 auto;display:none;gap:6px;align-items:center;justify-content:center;flex-wrap:wrap;}
  .halls.on{display:flex;}
  .hallchip{background:rgba(0,0,0,.3);border-radius:999px;padding:6px 13px;font-size:12.5px;font-weight:600;opacity:.62;
    box-shadow:inset 0 2px 0 rgba(255,255,255,.07);display:flex;align-items:center;gap:6px;}
  .hallchip.on{background:var(--paper);color:var(--ink);opacity:1;}
  .hallchip .pip{width:8px;height:8px;border-radius:99px;background:var(--danger);display:none;}
  .hallchip.alert .pip{display:block;animation:blip 1.1s infinite;}
  .hallchip.add{color:var(--mint);}

  .tile{position:relative;border-radius:var(--r);background:linear-gradient(180deg,#514595,#453B80);
    box-shadow:inset 0 -4px 0 rgba(0,0,0,.28), inset 0 3px 0 rgba(255,255,255,.1);
    display:flex;align-items:center;justify-content:center;overflow:visible;
    transition:transform .08s ease;}
  .tile:active{transform:scale(.94);}
  .tile.locked{background:rgba(0,0,0,.24);box-shadow:inset 0 0 0 2px rgba(255,255,255,.05);}
  .tile.locked .lockg{opacity:.3;font-size:19px;}
  .tile.empty .plus{position:absolute;font-size:28px;font-weight:700;opacity:0;transition:opacity .2s;color:#fff;}
  .tile.empty.placing{box-shadow:inset 0 -4px 0 rgba(0,0,0,.28), inset 0 0 0 3px var(--lilac);}
  .tile.empty.placing .plus{opacity:.55;}

  .art{position:absolute;inset:6px;display:block;filter:drop-shadow(0 4px 0 rgba(0,0,0,.28));}
  .tile.ready::before{content:'';position:absolute;inset:-3px;border-radius:calc(var(--r) + 3px);
    box-shadow:0 0 0 3px var(--cash),0 0 26px rgba(255,230,109,.6);pointer-events:none;}
  .tile.ready .art{animation:bob .8s ease-in-out infinite;}
  @keyframes bob{50%{transform:translateY(-3px);}}
  .heatveil{position:absolute;inset:0;border-radius:var(--r);pointer-events:none;opacity:0;
    background:radial-gradient(circle at 50% 55%, rgba(255,138,80,.95), rgba(255,60,60,.35) 70%, transparent 100%);
    mix-blend-mode:screen;transition:opacity .3s;}
  .tile.fault{animation:shake .32s infinite;}
  .tile.fault .art{filter:drop-shadow(0 0 8px var(--danger)) saturate(.4) brightness(.8);}
  @keyframes shake{25%{transform:translateX(-2px) rotate(-.6deg);}75%{transform:translateX(2px) rotate(.6deg);}}
  .warnpip{position:absolute;top:-6px;right:-6px;width:22px;height:22px;border-radius:99px;background:var(--danger);
    color:#fff;font-size:14px;font-weight:700;display:none;align-items:center;justify-content:center;box-shadow:0 3px 0 rgba(0,0,0,.3);}
  .tile.fault .warnpip{display:flex;}
  /* which tiles a fan actually reaches, so range is visible before you commit */
  .tile.cooled::after{content:'';position:absolute;inset:0;border-radius:var(--r);pointer-events:none;
    box-shadow:inset 0 0 0 2px rgba(143,196,255,.28);transition:box-shadow .2s;}
  #floor.fanmode .tile.cooled::after{box-shadow:inset 0 0 0 2px rgba(143,196,255,.9), inset 0 0 16px rgba(143,196,255,.34);}
  .tile.coolflash::after{content:'';position:absolute;inset:0;border-radius:var(--r);pointer-events:none;
    box-shadow:inset 0 0 0 3px var(--sky), inset 0 0 20px rgba(143,196,255,.5);}
  .tile.sellable::before{content:'';position:absolute;inset:-3px;border-radius:calc(var(--r) + 3px);
    box-shadow:0 0 0 2px rgba(255,92,122,.8);pointer-events:none;}
  .tile.selling{transform:scale(.88);}
  .tile.selling::before{content:'';position:absolute;inset:-3px;border-radius:calc(var(--r) + 3px);
    box-shadow:0 0 0 3px var(--danger),0 0 22px rgba(255,92,122,.5);pointer-events:none;animation:sellring .44s linear forwards;}
  @keyframes sellring{from{opacity:.25;}to{opacity:1;}}
  .spin{transform-origin:50% 50%;animation:spin 1.6s linear infinite;}
  .tile.hot .spin{animation-duration:.7s;}
  @keyframes spin{to{transform:rotate(360deg);}}
  .breathe{animation:breathe 2.2s ease-in-out infinite;transform-origin:50% 50%;}
  @keyframes breathe{50%{opacity:.45;}}

  .float{position:absolute;left:50%;top:34%;transform:translateX(-50%);font-size:17px;font-weight:700;color:var(--cash);
    pointer-events:none;text-shadow:0 2px 0 rgba(0,0,0,.45);animation:rise .85s ease-out forwards;white-space:nowrap;z-index:3;}
  @keyframes rise{to{transform:translate(-50%,-42px);opacity:0;}}
  .spark{position:absolute;width:7px;height:7px;border-radius:99px;background:var(--cash);pointer-events:none;z-index:3;}

  /* ---------- tray ---------- */
  .hint{flex:0 0 auto;display:flex;align-items:center;justify-content:center;font-size:13px;opacity:.72;min-height:19px;text-align:center;padding:0 6px;}
  .tray{flex:0 0 auto;display:flex;gap:7px;}
  .tool{flex:1;min-width:0;background:rgba(0,0,0,.3);border-radius:15px;padding:7px 4px 8px;display:flex;flex-direction:column;align-items:center;gap:1px;
    box-shadow:inset 0 2px 0 rgba(255,255,255,.07);transition:transform .09s;position:relative;}
  .tool:active{transform:scale(.95);}
  .tool svg{width:26px;height:26px;}
  .tool .n{font-size:11.5px;font-weight:600;}
  .tool .c{font-size:11.5px;color:var(--cash);font-weight:600;}
  .tool.sel{background:var(--paper);color:var(--ink);box-shadow:0 0 0 3px var(--lilac);}
  .tool.sel .c{color:#8a6600;}
  .tool.broke{opacity:.42;}
  .tool.lock{opacity:.5;}
  .tool.lock .c{color:var(--lilac);font-size:11px;}
  .tool.sellbtn{flex:0 0 auto;min-width:54px;}
  .tool.sellbtn.sel{background:var(--danger);color:#fff;box-shadow:0 0 0 3px rgba(255,92,122,.35);}
  .tool.sellbtn.sel .c{color:#fff;opacity:.85;}

  /* ---------- drawer ---------- */
  #scrim{position:fixed;inset:0;background:rgba(9,5,26,.6);opacity:0;pointer-events:none;transition:opacity .22s;z-index:8;cursor:pointer;}
  #scrim.open{opacity:1;pointer-events:auto;}
  #drawer{position:fixed;top:0;right:0;bottom:0;width:min(430px,88vw);z-index:9;display:flex;flex-direction:column;
    background:linear-gradient(180deg,#443A88,#2C2560);box-shadow:-18px 0 44px rgba(0,0,0,.5);
    transform:translateX(103%);transition:transform .26s cubic-bezier(.3,.9,.3,1);border-radius:26px 0 0 26px;
    padding:calc(env(safe-area-inset-top) + 14px) 13px calc(env(safe-area-inset-bottom) + 13px) 13px;}
  #drawer.open{transform:translateX(0);}
  .dhead{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:11px;}
  .dhead .money{font-size:21px;font-weight:700;color:var(--cash);}
  .close{width:38px;height:38px;border-radius:12px;background:rgba(0,0,0,.3);font-size:18px;}
  .tabs{display:flex;gap:5px;background:rgba(0,0,0,.3);padding:5px;border-radius:14px;margin-bottom:11px;}
  .tab{flex:1;padding:9px 2px;border-radius:10px;font-size:13.5px;opacity:.6;}
  .tab.on{background:var(--paper);color:var(--ink);opacity:1;}
  .list{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;display:flex;flex-direction:column;gap:8px;padding-bottom:6px;}
  .card{background:rgba(0,0,0,.26);border-radius:16px;padding:11px 12px;display:flex;gap:11px;align-items:center;
    box-shadow:inset 0 2px 0 rgba(255,255,255,.07);}
  .card .ic{flex:0 0 auto;width:36px;height:36px;display:flex;align-items:center;justify-content:center;font-size:23px;}
  .card .ic svg{width:32px;height:32px;}
  .card .mid{flex:1;min-width:0;}
  .card .t{font-size:14.5px;font-weight:600;display:flex;align-items:center;gap:7px;flex-wrap:wrap;}
  .card .lv{font-size:10.5px;background:rgba(255,255,255,.17);padding:2px 7px;border-radius:99px;font-weight:600;}
  .card .d{font-size:12.5px;opacity:.62;margin-top:2px;line-height:1.35;}
  .buy{flex:0 0 auto;background:var(--mint);color:#0C4437;border-radius:12px;padding:10px 12px;font-size:13.5px;font-weight:700;
    box-shadow:0 4px 0 #4EB99A;min-width:76px;}
  .buy:active{transform:translateY(2px);box-shadow:0 2px 0 #4EB99A;}
  .buy[disabled]{background:rgba(255,255,255,.12);color:rgba(255,255,255,.42);box-shadow:none;}
  .buy.max{background:var(--butter);color:#5A3D00;box-shadow:none;}
  .sechead{font-size:11px;letter-spacing:.12em;text-transform:uppercase;opacity:.45;margin:6px 2px 0;}

  /* ---------- toast + modal ---------- */
  #toasts{position:fixed;left:0;right:0;top:calc(env(safe-area-inset-top) + 76px);z-index:12;display:flex;flex-direction:column;align-items:center;gap:7px;pointer-events:none;}
  .toast{background:var(--paper);color:var(--ink);border-radius:14px;padding:9px 16px;font-size:14px;font-weight:600;
    box-shadow:0 8px 22px rgba(0,0,0,.4);animation:tin .3s ease-out, tout .3s ease-in 2.6s forwards;max-width:88vw;text-align:center;}
  @keyframes tin{from{transform:translateY(-14px);opacity:0;}}
  @keyframes tout{to{transform:translateY(-14px);opacity:0;}}
  #modal{position:fixed;inset:0;z-index:14;display:none;align-items:center;justify-content:center;background:rgba(9,5,26,.7);padding:20px;}
  #modal.open{display:flex;}
  .sheet{background:linear-gradient(180deg,#4A3F94,#332B6C);border-radius:24px;padding:22px;max-width:340px;width:100%;
    box-shadow:0 22px 50px rgba(0,0,0,.5);text-align:center;}
  .sheet h3{margin:0 0 6px;font-size:21px;font-weight:700;}
  .sheet p{margin:0 0 16px;font-size:14px;opacity:.72;line-height:1.45;}
  .sheet .big{font-size:32px;font-weight:700;color:var(--cash);margin:8px 0 14px;}
  .sheet button{background:var(--mint);color:#0C4437;border-radius:14px;padding:13px 22px;font-size:16px;font-weight:700;width:100%;box-shadow:0 5px 0 #4EB99A;}
  .savenote{font-size:11.5px;opacity:.5;text-align:center;padding-top:2px;}

  @media (max-width:560px){
    .wallet .amt{font-size:21px;} .wallet .rate{display:none;}
    .shopbtn{padding:11px 13px;font-size:15px;}
    .meter .val{font-size:12px;} .tool .n{font-size:10.5px;}
    .meter{padding:7px 9px;}
    /* Below this width the wallet and Shop button leave no room for the meter
       captions, so hide them from sight but keep them for screen readers. */
    .meter .name{position:absolute;width:1px;height:1px;margin:-1px;padding:0;
      overflow:hidden;clip-path:inset(50%);white-space:nowrap;}
    .meter .top{justify-content:center;}
  }
  @media (prefers-reduced-motion:reduce){*{animation:none!important;}}
</style>
</head>
<body>
<div id="app">
  <header>
    <div class="wallet" id="wallet"><span class="amt num" id="cash">$0</span><span class="rate num" id="rate"></span></div>
    <div class="meters">
      <div class="meter" id="pmeter">
        <div class="top"><span class="name">Power</span><span class="val num" id="pval">0/10 kW</span></div>
        <div class="bar"><i id="pbar" style="width:0%;background:var(--butter)"></i></div>
      </div>
      <div class="meter" id="hmeter">
        <div class="top"><span class="name">Heat</span><span class="val num" id="hval">cool</span></div>
        <div class="bar"><i id="hbar" style="width:0%;background:var(--sky)"></i></div>
      </div>
    </div>
    <button class="shopbtn" id="shopbtn"><span>Shop</span><span class="dot"></span></button>
  </header>
  <main>
    <div class="halls" id="halls"></div>
    <div class="stage"><div id="floor">
      <div class="ghost g2"></div><div class="ghost g1"></div>
    </div></div>
  </main>
  <div class="hint" id="hint" aria-live="polite"></div>
  <div class="tray" id="tray"></div>
</div>

<div id="scrim"></div>
<div id="drawer">
  <div class="dhead">
    <span class="money num" id="dcash">$0</span>
    <button class="close" id="dclose">✕</button>
  </div>
  <div class="tabs">
    <button class="tab on" data-tab="upgrades">Upgrades</button>
    <button class="tab" data-tab="hardware">Hardware</button>
    <button class="tab" data-tab="automate">Automate</button>
    <button class="tab" data-tab="floor">Floor</button>
  </div>
  <div class="list" id="dlist"></div>
  <div class="savenote" id="savenote"></div>
</div>

<div id="toasts"></div>
<div id="modal"><div class="sheet">
  <h3 id="mtitle">While you were out</h3>
  <p id="mbody"></p>
  <div class="big num" id="mbig"></div>
  <button id="mok">Collect</button>
</div></div>

<script>
(function(){
'use strict';

/* ================= artwork ================= */
const ART = {
  rack:(o)=>`<svg class="art" viewBox="0 0 64 64">
    <rect x="9" y="6" width="46" height="52" rx="7" fill="#3FA98C"/>
    <rect x="9" y="6" width="46" height="48" rx="7" fill="#7CE0C3"/>
    <rect x="15" y="12" width="34" height="9" rx="3.5" fill="#12604F"/>
    <rect x="15" y="25" width="34" height="9" rx="3.5" fill="#12604F"/>
    <rect x="15" y="38" width="34" height="9" rx="3.5" fill="#12604F"/>
    <g fill="#0B3F33">
      <rect x="18" y="15.5" width="14" height="2" rx="1"/><rect x="18" y="28.5" width="14" height="2" rx="1"/><rect x="18" y="41.5" width="14" height="2" rx="1"/>
    </g>
    <circle class="led" cx="44" cy="16.5" r="2.4" fill="${o.l>0?'#FFE66D':'#0B3F33'}"/>
    <circle class="led" cx="44" cy="29.5" r="2.4" fill="${o.l>1?'#FFE66D':'#0B3F33'}"/>
    <circle class="led" cx="44" cy="42.5" r="2.4" fill="${o.l>2?'#FFE66D':'#0B3F33'}"/>
    <rect x="9" y="50" width="46" height="4" rx="2" fill="rgba(0,0,0,.14)"/>
    <rect class="fillbar" data-max="38" x="13" y="51" width="${38*o.f}" height="2" rx="1" fill="#FFFFFF"/>
  </svg>`,
  gpu:(o)=>`<svg class="art" viewBox="0 0 64 64">
    <rect x="7" y="8" width="50" height="50" rx="8" fill="#C46FE0"/>
    <rect x="7" y="8" width="50" height="46" rx="8" fill="#FF9ECF"/>
    <g fill="#7A1D5E" opacity=".55">
      <rect x="12" y="14" width="4" height="34" rx="2"/><rect x="19" y="14" width="4" height="34" rx="2"/>
      <rect x="41" y="14" width="4" height="34" rx="2"/><rect x="48" y="14" width="4" height="34" rx="2"/>
    </g>
    <rect x="26" y="18" width="12" height="26" rx="4" fill="#7A1D5E"/>
    <circle cx="32" cy="31" r="5.5" fill="#FFE66D" class="breathe"/>
    <rect x="7" y="50" width="50" height="4" rx="2" fill="rgba(0,0,0,.16)"/>
    <rect class="fillbar" data-max="42" x="11" y="51" width="${42*o.f}" height="2" rx="1" fill="#FFFFFF"/>
  </svg>`,
  fan:(o)=>`<svg class="art" viewBox="0 0 64 64">
    <rect x="8" y="10" width="48" height="46" rx="10" fill="#5D97DB"/>

/* ================= state ================= */
const S = {
  cash:40, tool:'rack', earned:0, botT:0, savedAt:Date.now(), hall:0,
  counts:{rack:0,fan:0,gen:0,ac:0,batt:0,gpu:0},

HALLS.forEach((h,hi)=>{
  const hs=S.halls[hi];
  for(let y=0;y<h.rows;y++) for(let x=0;x<h.cols;x++)
    hs.tiles.push({h:hi,x,y,i:y*h.cols+x,type:null,heat:0,buf:0,fault:0,rep:0,fanned:0,el:null,art:null});
});
/* Flat list of every tile in an open hall — the sim walks this every frame. */
let live=[];
function rebuildLive(){
  live=[];
  for(const hs of S.halls) if(hs.open) for(const t of hs.tiles) live.push(t);
}

/* ================= helpers ================= */
function pct(f){return Math.round(f*100)+'%';}
function botPeriod(l){return Math.max(0.35, 3.2-0.34*(l-1));}
function money(n){
  if(n<0)n=0;
  if(n<1000) return '$'+(n<10?Math.round(n*10)/10:Math.floor(n));
  const u=['k','M','B','T','Qa','Qi']; let i=-1;
  while(n>=1000&&i<u.length-1){n/=1000;i++;}
  return '$'+(n<10?n.toFixed(2):n<100?n.toFixed(1):Math.floor(n))+u[i];
}
const costOf=(k,n)=>Math.floor(MACH[k].base*Math.pow(MACH[k].growth,n===undefined?S.counts[k]:n));
const upCost=(t,k,l)=>Math.floor(t[k].base*Math.pow(t[k].growth,l));
const rateMult   =()=>1+0.22*S.up.density;
const price      =()=>(1+0.6*S.up.bandwidth)*(1+0.09*S.up.contracts);
const bufMax     =()=>8+5*S.up.buffer;
const coolMult   =()=>1+0.18*S.up.cooling;
const drawMult   =()=>Math.pow(0.93,S.up.power);
const heatMult   =()=>Math.pow(0.93,S.up.thermal);
const capMult    =()=>1+0.09*S.up.surge;
const tapBonus   =()=>1+0.16*S.up.override;
const faultMult  =()=>Math.pow(0.78,S.auto.shield);
const unlocked   =t=>t.y<S.halls[t.h].rows;
const isCompute  =t=>t.type==='rack'||t.type==='gpu';
const REFUND     =0.5;
const REDUCED    =!!(window.matchMedia&&matchMedia('(prefers-reduced-motion: reduce)').matches);
const $          =id=>document.getElementById(id);
function setText(el,v){ if(el._t!==v){ el._t=v; el.textContent=v; } }
function setStyle(el,prop,v){ const k='_s'+prop; if(el[k]!==v){ el[k]=v; el.style[prop]=v; } }

const canOpenRow = hi => S.halls[hi].rows < HALLS[hi].rows;
const rowCostOf  = hi => HALLS[hi].rowCost[S.halls[hi].rows]||0;
const nextHall   = () => S.halls.findIndex(h=>!h.open);
const openHalls  = () => S.halls.reduce((n,h)=>n+(h.open?1:0),0);
function machinesIn(hi){ let n=0; for(const t of S.halls[hi].tiles) if(t.type) n++; return n; }

function neighbours(t){
  const H=HALLS[t.h], tiles=S.halls[t.h].tiles, o=[];
  for(const[dx,dy]of[[1,0],[-1,0],[0,1],[0,-1]]){
    const nx=t.x+dx, ny=t.y+dy;
    if(nx<0||ny<0||nx>=H.cols||ny>=H.rows)continue;
    o.push(tiles[ny*H.cols+nx]);
  }
  return o;
}
/* Fan coverage only changes when the floor does, so cache it per tile instead of
   re-walking neighbours every frame. It doubles as the range highlight. */
function recomputeFans(hi){
  for(const t of S.halls[hi].tiles){
    let n=0;
    for(const nb of neighbours(t)) if(nb.type==='fan') n++;
    t.fanned=n;
  }
}

/* Power is site-wide, and both the live sim and the offline catch-up need it. */
function powerState(){
  let draw=0, cap=10;
  for(const t of live){ if(!t.type)continue; const m=MACH[t.type];
    draw+=(m.draw||0)*drawMult(); cap+=(m.cap||0); }
  cap*=capMult();
  return {draw, cap, brown: draw>cap ? cap/draw : 1};
}

/* ================= save ================= */
const KEY='coldwater.v1';
const store={
  ok:(()=>{try{localStorage.setItem('__cw','1');localStorage.removeItem('__cw');return true;}catch(e){return false;}})(),
  get(){try{return localStorage.getItem(KEY);}catch(e){return null;}},
  set(v){try{localStorage.setItem(KEY,v);}catch(e){}},
  clear(){try{localStorage.removeItem(KEY);}catch(e){}}
};
function save(){
  if(!store.ok) return;
  S.savedAt=Date.now();
  store.set(JSON.stringify({
    v:2, cash:S.cash, earned:S.earned, savedAt:S.savedAt, hall:S.hall,
    tool:S.tool===SELL?'rack':S.tool,   /* never reopen the game holding the sell tool */
    counts:S.counts, up:S.up, auto:S.auto, hard:S.hard, flags:S.flags,
    halls:S.halls.map(hs=>({open:hs.open?1:0, rows:hs.rows,
      tiles:hs.tiles.map(t=>t.type?[t.i,t.type,Math.round(t.heat),+t.buf.toFixed(2),t.fault>0?1:0]:null).filter(Boolean)}))
  }));
}
function load(){
  const raw=store.get(); if(!raw) return null;
  try{
    const d=JSON.parse(raw);
    const num=(v,f)=>Number.isFinite(+v)?+v:f;
    const clamp=(v,lo,hi)=>Math.min(hi,Math.max(lo,v));
    S.cash=Math.max(0,num(d.cash,0));
    S.earned=Math.max(0,num(d.earned,0));
    if(MACH[d.tool]) S.tool=d.tool;
    Object.assign(S.up,d.up||{}); Object.assign(S.auto,d.auto||{});
    Object.assign(S.hard,d.hard||{}); Object.assign(S.flags,d.flags||{});
    for(const k in UPG)  S.up[k]  =clamp(Math.round(num(S.up[k],0)),  0,UPG[k].max);
    for(const k in AUTO) S.auto[k]=clamp(Math.round(num(S.auto[k],0)),0,AUTO[k].max);
    for(const k in S.hard) S.hard[k]=S.hard[k]?1:0;

    /* A v1 save was a single floor. It becomes Hall A. */
    const halls = Array.isArray(d.halls) ? d.halls
      : [{open:1, rows:num(d.rows,HALLS[0].start), tiles:d.tiles||[]}];

    halls.forEach((hd,hi)=>{
      if(!hd||hi>=S.halls.length) return;
      const H=HALLS[hi], hs=S.halls[hi];
      hs.open = hi===0 ? 1 : (hd.open?1:0);
      hs.rows = clamp(Math.round(num(hd.rows,H.start)), H.start, H.rows);
      if(!hs.open) return;
      (hd.tiles||[]).forEach(row=>{
        if(!row) return;
        const [i,type,heat,buf,fault]=row;
        const t=hs.tiles[i];
        if(!t||!MACH[type]||!unlocked(t))return;
        if(MACH[type].unlock&&!S.hard[MACH[type].unlock])return;
        t.type=type; t.heat=clamp(num(heat,0),0,100);
        t.buf=Math.max(0,num(buf,0)); t.fault=fault?1:0; t.rep=0;
      });
    });
    S.hall=clamp(Math.round(num(d.hall,0)),0,S.halls.length-1);
    if(!S.halls[S.hall].open) S.hall=0;

    /* The tiles are the source of truth: a stale counts map would mis-price everything. */
    for(const k in S.counts) S.counts[k]=0;
    for(const hs of S.halls){
      if(!hs.open){ for(const t of hs.tiles) t.type=null; continue; }
      for(const t of hs.tiles){ if(t.type) S.counts[t.type]++; t.buf=Math.min(t.buf,bufMax()); }
    }
    return d.savedAt||null;
  }catch(e){ return null; }
}
function offlineEarnings(savedAt){
  if(!Number.isFinite(savedAt)||savedAt<=0) return 0;
  const secs=Math.min(Math.max(0,(Date.now()-savedAt)/1000), 8*3600);
  if(secs<60) return 0;
  const eff=Math.min(1,0.35+0.13*S.auto.night), brown=powerState().brown;
  let out=0;
  for(const t of live) if(isCompute(t)&&t.fault===0&&unlocked(t))
    out += MACH[t.type].rate*rateMult()*price()*secs*eff*brown;
  return out;
}

/* ================= floor ================= */
const floorEl=$('floor'), stageEl=document.querySelector('.stage');
const ghost1=document.querySelector('.ghost.g1'), ghost2=document.querySelector('.ghost.g2');
function buildHall(hi){
  const H=HALLS[hi], hs=S.halls[hi];
  if(hs.grid) return;
  const g=document.createElement('div');
  g.className='hallgrid';
  g.style.gridTemplateColumns=`repeat(${H.cols}, var(--ts))`;
  g.style.gridTemplateRows=`repeat(${H.rows}, var(--ts))`;
  hs.tiles.forEach(t=>{
    const el=document.createElement('button');
    el.className='tile'; el.type='button';
    el.innerHTML='<div class="heatveil"></div><span class="plus">+</span><span class="lockg"></span><span class="warnpip">!</span>';
    /* 'click' rather than 'pointerup': a pointerup that began somewhere else
       (a drag, a scroll) must not count as a tap, and buttons get keyboard support free. */
    el.addEventListener('click',()=>{ if(el._skip){ el._skip=false; return; } tapTile(t); });
    el.addEventListener('pointerdown',e=>{ el._skip=false; startHold(t,el,e); });
    el.addEventListener('pointermove',e=>{
      if(hold.el===el && Math.abs(e.clientX-hold.x)+Math.abs(e.clientY-hold.y)>14) cancelHold();
    });
    el.addEventListener('pointerup',cancelHold);
    el.addEventListener('pointercancel',cancelHold);
    el.addEventListener('pointerleave',cancelHold);
    el.addEventListener('contextmenu',e=>e.preventDefault());
    t.el=el; t.veil=el.querySelector('.heatveil'); g.appendChild(el);
  });
  hs.grid=g; floorEl.appendChild(g);
  g.classList.toggle('on',hi===S.hall);
}
function switchHall(hi){
  if(!S.halls[hi]||!S.halls[hi].open||hi===S.hall) return;
  S.hall=hi;
  for(let i=0;i<S.halls.length;i++)
    if(S.halls[i].grid) S.halls[i].grid.classList.toggle('on',i===hi);
  S.halls[hi].tiles.forEach(paint);
  sizeFloor(); paintHalls(); save();
}
function sizeFloor(){
  const H=HALLS[S.hall];
  const w=stageEl.clientWidth-30, h=stageEl.clientHeight-30;
  const s=Math.max(40,Math.min(Math.floor((w-9*(H.cols-1))/H.cols),Math.floor((h-9*(H.rows-1))/H.rows),112));
  document.documentElement.style.setProperty('--ts',s+'px');
}
addEventListener('resize',sizeFloor);
addEventListener('orientationchange',()=>setTimeout(sizeFloor,260));

function paint(t){
  const el=t.el; if(!el) return;
  el.className='tile'+(unlocked(t)?'':' locked')+(t.type?' machine':' empty');
  const old=el.querySelector('svg'); if(old) old.remove();
  el.querySelector('.lockg').textContent = unlocked(t)?'':'🔒';
  el.setAttribute('aria-label', !unlocked(t)?'Locked tile' : t.type?MACH[t.type].name : 'Empty tile');
  t.artQ=-1; t.artL=-1; t._veil=null;
  if(!t.type){ t.art=null; t.bar=null; t.leds=null; return; }
  el.insertAdjacentHTML('beforeend', ART[t.type]({f:0,l:0}));
  t.art=el.querySelector('svg');
  t.bar=t.art.querySelector('.fillbar');
  t.leds=t.art.querySelectorAll('.led');
}
/* Mutate the existing SVG nodes; re-parsing the whole sprite every few frames
   was the single biggest source of DOM churn on a full floor. */
function repaintArt(t,bmax){
  if(!isCompute(t)||!t.art) return;
  const f=Math.min(1,t.buf/bmax);
  const q=Math.round(f*40)/40;
  const l=t.fault>0?0:Math.ceil(f*3);
  if(q===t.artQ&&l===t.artL) return;
  if(q!==t.artQ&&t.bar) t.bar.setAttribute('width',(t.bar.dataset.max*q).toFixed(2));
  if(l!==t.artL&&t.leds) for(let i=0;i<t.leds.length;i++)
    t.leds[i].setAttribute('fill', i<l?'#FFE66D':'#0B3F33');
  t.artQ=q; t.artL=l;
}

/* ================= hall switcher ================= */
const hallsEl=$('halls');
function buildHalls(){
  hallsEl.innerHTML='';
  S.halls.forEach((hs,i)=>{
    if(!hs.open) return;
    const b=document.createElement('button');
    b.type='button'; b.className='hallchip'; b.dataset.h=i;
    b.innerHTML=`<span>${HALLS[i].name}</span><span class="pip"></span>`;
    b.addEventListener('click',()=>switchHall(i));
    hallsEl.appendChild(b);
  });
  const nx=nextHall();
  if(nx>=0){
    const b=document.createElement('button');
    b.type='button'; b.className='hallchip add';
    b.textContent='+ '+HALLS[nx].name;
    b.addEventListener('click',()=>openDrawer('floor'));
    hallsEl.appendChild(b);
  }
  paintHalls();
}
function paintHalls(){
  const nx=nextHall(), n=openHalls();
  /* Stay out of the way until a second hall is either owned or within reach. */
  hallsEl.classList.toggle('on', n>1 || (nx>=0 && S.cash>=HALLS[nx].cost*0.25));
  for(const b of hallsEl.children){
    if(b.dataset.h===undefined) continue;
    const i=+b.dataset.h;
    b.classList.toggle('on', i===S.hall);
    b.classList.toggle('alert', !!S.halls[i].warn && i!==S.hall);
  }
  ghost1.classList.toggle('on', n>1);
  ghost2.classList.toggle('on', n>2);
}

/* ================= interaction ================= */
function tapTile(t){
  if(!unlocked(t)){ float(t,'Locked in shop'); return; }
  if(S.tool===SELL){
    if(t.type) sellTile(t); else float(t,'Nothing to sell');
    return;
  }
  if(isCompute(t)){
    if(t.fault>0){ t.fault=0; t.rep=0; t.heat=50; float(t,'Rebooted'); return; }
    if(t.buf>0.05){ collect(t,true); return; }
  }
  if(t.type==='fan'){ flashCoverage(t); float(t,'Cools these'); return; }
  if(t.type){ float(t,MACH[t.type].name); return; }
  place(t,S.tool);
}
function flashCoverage(t){
  for(const n of neighbours(t)){
    if(!unlocked(n)||!n.el) continue;
    n.el.classList.add('coolflash');
    setTimeout(()=>n.el.classList.remove('coolflash'),900);
  }
}
/* Placement would be permanent otherwise: a misplaced chiller used to be a dead
   tile forever. Sell mode in the tray does the same thing without the gesture. */
const hold={el:null,t:null,x:0,y:0,timer:0,ring:0};
function startHold(t,el,e){
  cancelHold();
  if(!unlocked(t)||!t.type||S.tool===SELL) return;
  hold.el=el; hold.t=t; hold.x=e.clientX; hold.y=e.clientY;
  hold.ring=setTimeout(()=>{ if(hold.el===el) el.classList.add('selling'); },190);
  hold.timer=setTimeout(()=>{
    const tt=hold.t, ee=hold.el;
    cancelHold();
    if(ee) ee._skip=true;   /* swallow the click this press will still produce */
    if(tt) sellTile(tt);
  },640);
}
function cancelHold(){
  clearTimeout(hold.timer); clearTimeout(hold.ring);
  if(hold.el) hold.el.classList.remove('selling');
  hold.el=null; hold.t=null;
}
function sellTile(t){
  if(!t.type||!unlocked(t)) return;
  const k=t.type;
  let gain=0;
  if(isCompute(t)&&t.buf>0.05){ gain=t.buf*price(); S.cash+=gain; S.earned+=gain; }
  const n=Math.max(0,S.counts[k]-1);
  const refund=Math.floor(costOf(k,n)*REFUND);
  S.counts[k]=n; S.cash+=refund;
  t.type=null; t.heat=0; t.buf=0; t.fault=0; t.rep=0;
  paint(t); recomputeFans(t.h); paintTray(); save();
  float(t,'Sold +'+money(refund+gain)); sparks(t); bumpWallet();
  if(!S.flags.sold){ S.flags.sold=1; toast('Sold back for half. Long-press works too.'); }
}
function place(t,k){
  const m=MACH[k];
  if(m.unlock && !S.hard[m.unlock]){ float(t,'Locked'); toast('Unlock '+m.name+' in the Hardware tab.'); return; }
  const c=costOf(k);
  if(S.cash<c){ float(t,'Need '+money(c)); return; }
  S.cash-=c; t.type=k; t.heat=0; t.buf=0; t.fault=0; t.rep=0; S.counts[k]++;
  paint(t); recomputeFans(t.h); paintTray(); save();
  if(k==='rack'&&S.counts.rack===1) toast('Wait for it to fill, then tap to sell.');
  if(k==='fan'&&S.counts.fan===1) toast('The blue outline is what it cools.');
}
function collect(t,manual){
  const v=t.buf*price()*(manual?tapBonus():1);
  S.cash+=v; S.earned+=v; t.buf=0;
  float(t,'+'+money(v)); sparks(t); bumpWallet();
}
function float(t,txt){
  if(!t.el) return;
  const f=document.createElement('div'); f.className='float'; f.textContent=txt;
  t.el.appendChild(f); setTimeout(()=>f.remove(),850);
}
function sparks(t){
  if(REDUCED||!t.el) return;
  for(let i=0;i<5;i++){
    const s=document.createElement('div'); s.className='spark';
    s.style.left='50%'; s.style.top='45%';
    t.el.appendChild(s);
    const a=Math.random()*Math.PI*2, d=18+Math.random()*22;
    s.animate([{transform:'translate(-50%,-50%) scale(1)',opacity:1},
               {transform:`translate(${Math.cos(a)*d-8}px,${Math.sin(a)*d-8}px) scale(0)`,opacity:0}],
              {duration:480+Math.random()*220,easing:'cubic-bezier(.2,.8,.4,1)'});
    setTimeout(()=>s.remove(),700);
  }
}
let bumpT;
function bumpWallet(){
  const w=$('wallet');
  w.classList.remove('bump'); void w.offsetWidth; w.classList.add('bump');
  clearTimeout(bumpT); bumpT=setTimeout(()=>w.classList.remove('bump'),260);
}
function toast(msg){
  const t=document.createElement('div'); t.className='toast'; t.textContent=msg;
  $('toasts').appendChild(t);
  setTimeout(()=>t.remove(),3000);
}
function once(flag,msg){ if(S.flags[flag])return; S.flags[flag]=1; toast(msg); }

/* ================= sim ================= */
let last=performance.now(), saveT=0, looping=false;
/* Park the loop while the tab is hidden so the away-time catch-up in
   visibilitychange is the only thing paying out. visibilitychange restarts it
   rather than trusting the browser to re-fire a queued frame. */
function startLoop(){
  if(looping) return;
  looping=true; last=performance.now();
  requestAnimationFrame(tick);
}
function tick(now){
  if(document.hidden){ looping=false; return; }
  let dt=(now-last)/1000; last=now;
  if(dt>0.3) dt=0.3;

  const ps=powerState(), draw=ps.draw, cap=ps.cap, brown=ps.brown;
  if(brown<1) once('brown','Brownout. Add a genset or a battery.');

  /* A chiller only cools the hall it stands in. */
  const gcool=S.halls.map(()=>0);
  for(const hs of S.halls) hs.warn=0;
  for(const t of live) if(t.type==='ac') gcool[t.h]+=MACH.ac.global*coolMult();

  let hottest=0, anyFault=false, income=0;
  const bmax=bufMax();
  for(const t of live){
    if(!t.type){ t.heat=Math.max(0,t.heat-(1.2+0.3*S.up.ambient)*dt); continue; }
    const m=MACH[t.type];
    /* Cooling is powered too: a brownout should not leave the fans at full tilt. */
    let cool=gcool[t.h]*brown+0.55+0.12*S.up.ambient;
    cool+=t.fanned*MACH.fan.cools*coolMult()*brown;
    if(t.type==='fan') cool+=MACH.fan.cools*coolMult()*0.5*brown;

    const throttle = t.heat<45 ? 1 : Math.max(0.12, 1-(t.heat-45)/52);
    const active = t.fault>0 ? 0 : throttle*brown;

    if(isCompute(t)){
      const full=t.buf>=bmax-0.001;
      const out=m.rate*rateMult()*active;
      /* Only count what is actually being banked, so the /s readout stops lying
         about stalled racks. */
      if(!full){ t.buf=Math.min(bmax,t.buf+out*dt); income+=out*price(); }
      else if(S.auto.overflow){ const g=out*0.25*price(); S.cash+=g*dt; S.earned+=g*dt; income+=g; }
      t.heat+=m.heat*heatMult()*(full&&!S.auto.overflow?0.4:1)*active*dt;
    } else {
      t.heat+=(m.heat||0)*heatMult()*brown*dt;
    }
    t.heat=Math.max(0,Math.min(100,t.heat-cool*dt));

    if(isCompute(t)&&t.fault===0&&t.heat>90&&Math.random()<0.32*faultMult()*dt){
      t.fault=1; t.rep=0; once('fault','Overheated. Tap the shaking tile to reboot it.');
    }
    if(t.fault>0){
      t.heat=Math.max(0,t.heat-5*dt); anyFault=true; S.halls[t.h].warn=1;
      /* Repair time is tracked separately from the fault flag; folding the two
         together made the drone finish a second earlier than the shop promises. */
      if(S.auto.reboot>0){
        t.rep+=dt;
        if(t.rep>=5-0.7*S.auto.reboot){ t.fault=0; t.rep=0; t.heat=42; }
      }
    }
    if(t.heat>90) S.halls[t.h].warn=1;
    if(t.heat>hottest) hottest=t.heat;
  }

  if(S.auto.bot>0){
    S.botT+=dt;
    if(S.botT>=botPeriod(S.auto.bot)){
      S.botT=0;
      for(const t of live) if(isCompute(t)&&t.buf>0.05&&t.fault===0) collectQuiet(t);
    }
  }

  saveT+=dt; if(saveT>5){ saveT=0; save(); }
  draw_(draw,cap,hottest,brown,anyFault,income,bmax);
  requestAnimationFrame(tick);
}
addEventListener('pageshow',startLoop);
function collectQuiet(t){ const v=t.buf*price(); S.cash+=v; S.earned+=v; t.buf=0; }

/* ================= draw ================= */
const UI={cash:$('cash'),dcash:$('dcash'),rate:$('rate'),pbar:$('pbar'),pval:$('pval'),pmeter:$('pmeter'),
  hbar:$('hbar'),hval:$('hval'),hmeter:$('hmeter'),shopbtn:$('shopbtn'),hint:$('hint')};
let affordT=0, affordable=false;
function draw_(draw,cap,hottest,brown,anyFault,income,bmax){
  const selling=S.tool===SELL;
  const tool=selling?null:MACH[S.tool];
  const canPlace=!!tool&&!(tool.unlock&&!S.hard[tool.unlock])&&S.cash>=costOf(S.tool);
  floorEl.classList.toggle('fanmode',S.tool==='fan');
  /* Only the hall you are standing in needs its pixels updated. */
  for(const t of S.halls[S.hall].tiles){
    const el=t.el;
    if(!unlocked(t)){ if(!el.classList.contains('locked')) paint(t); continue; }
    if(el.classList.contains('locked')) paint(t);
    const veil=Math.max(0,(t.heat-32)/110).toFixed(3);
    if(t._veil!==veil){ t._veil=veil; t.veil.style.opacity=veil; }
    el.classList.toggle('hot',t.heat>70);
    el.classList.toggle('fault',t.fault>0);
    el.classList.toggle('cooled',t.fanned>0);
    el.classList.toggle('sellable',selling&&!!t.type);
    if(isCompute(t)){
      repaintArt(t,bmax);
      el.classList.toggle('ready',t.buf>=bmax*0.999&&t.fault===0);
    }
    el.classList.toggle('placing',!t.type&&canPlace);
  }
  const cash=money(S.cash);
  setText(UI.cash,cash); setText(UI.dcash,cash);
  setText(UI.rate,income>0?money(income)+'/s':'');
  setText(UI.pval,`${draw.toFixed(0)}/${cap.toFixed(0)} kW`);
  setStyle(UI.pbar,'width',Math.min(100,draw/cap*100).toFixed(1)+'%');
  setStyle(UI.pbar,'background',brown<1?'var(--danger)':draw/cap>.85?'var(--coral)':'var(--butter)');
  UI.pmeter.classList.toggle('warn',brown<1);
  setText(UI.hval,hottest<40?'cool':hottest<70?'warm':hottest<90?'hot':'critical');
  setStyle(UI.hbar,'width',hottest.toFixed(1)+'%');
  setStyle(UI.hbar,'background',hottest<45?'var(--sky)':hottest<75?'var(--butter)':'var(--coral)');
  UI.hmeter.classList.toggle('warn',hottest>90||anyFault);
  /* anyAffordable() walks every price curve; four times a second is plenty for a blinking dot. */
  if(--affordT<=0){ affordT=15; affordable=anyAffordable(); }
  UI.shopbtn.classList.toggle('has',affordable);
  setText(UI.hint,hint(brown,anyFault,hottest));
  paintTray(); paintHalls();
}
function hint(brown,anyFault,hottest){
  if(S.tool===SELL) return 'Sell mode: tap a machine to sell it back for half.';
  if(anyFault) return 'A rack faulted. Tap the shaking tile to reboot it.';
  if(brown<1) return 'Brownout — drawing more power than you make. Place a genset.';
  if(S.counts.rack===0) return 'Pick Rack below, then tap an empty tile.';
  if(S.earned<1) return 'Let the rack fill, then tap it to sell the compute.';
  if(S.counts.fan===0&&hottest>60) return 'Getting hot. A fan cools its four neighbours.';
  if(S.earned>400&&S.auto.bot===0) return 'Tired of tapping? Buy a scheduler bot.';
  if(S.earned>4000&&!S.hard.gpu) return 'Hardware tab has something faster than racks.';
  const nx=nextHall();
  if(nx>0&&!canOpenRow(S.hall)&&S.cash>=HALLS[nx].cost*0.5) return `${HALLS[S.hall].name} is full. ${HALLS[nx].name} is in the Floor tab.`;
  if(S.earned>150&&!S.flags.sold) return 'Put something in the wrong place? Sell it with the Sell tool.';
  return '';
}

/* ================= tray ================= */
const trayEl=$('tray');
const SELL_ICON=`<svg viewBox="0 0 64 64"><path d="M35 7H15a8 8 0 0 0-8 8v20a8 8 0 0 0 2.3 5.7l20 20a8 8 0 0 0 11.4 0l16-16a8 8 0 0 0 0-11.4l-20-20A8 8 0 0 0 35 7z" fill="#FF7A59"/><circle cx="21" cy="21" r="5.5" fill="#FFF1EC"/></svg>`;
function buildTray(){
  trayEl.innerHTML='';
  for(const k in MACH){
    const b=document.createElement('button');
    b.className='tool'; b.dataset.k=k; b.type='button';
    b.innerHTML=ICON(k)+`<span class="n">${MACH[k].name}</span><span class="c num"></span>`;
    b.addEventListener('click',()=>{
      const m=MACH[k];
      if(m.unlock&&!S.hard[m.unlock]){ openDrawer('hardware'); return; }
      S.tool=k; paintTray(); save();});
    trayEl.appendChild(b);
  }
  const b=document.createElement('button');
  b.className='tool sellbtn'; b.dataset.k=SELL; b.type='button';
  b.innerHTML=SELL_ICON+`<span class="n">Sell</span><span class="c num">half</span>`;
  b.addEventListener('click',()=>{ S.tool = S.tool===SELL?'rack':SELL; paintTray(); save(); });
  trayEl.appendChild(b);
}
function paintTray(){
  for(const b of trayEl.children){
    const k=b.dataset.k;
    if(k===SELL){ b.classList.toggle('sel',S.tool===SELL); continue; }
    const m=MACH[k],lock=!!(m.unlock&&!S.hard[m.unlock]),c=costOf(k);
    b.classList.toggle('lock',lock);
    setText(b.querySelector('.c'),lock?'Locked':money(c));
    b.classList.toggle('sel',S.tool===k&&!lock);
    b.classList.toggle('broke',!lock&&S.cash<c);
  }
}

/* ================= drawer ================= */
const drawer=$('drawer'), scrim=$('scrim');
let tab='upgrades';
function openDrawer(t){
  if(t){ tab=t; document.querySelectorAll('.tab').forEach(x=>x.classList.toggle('on',x.dataset.tab===t)); }
  drawer.classList.add('open'); scrim.classList.add('open'); renderList();
}
function closeDrawer(){ drawer.classList.remove('open'); scrim.classList.remove('open'); save(); }
$('shopbtn').addEventListener('click',()=>openDrawer());
$('dclose').addEventListener('click',closeDrawer);
scrim.addEventListener('click',closeDrawer);
document.querySelectorAll('.tab').forEach(b=>b.addEventListener('click',()=>{
  tab=b.dataset.tab;
  document.querySelectorAll('.tab').forEach(x=>x.classList.toggle('on',x===b));
  renderList();
}));

function anyAffordable(){
  for(const k in UPG) if(S.up[k]<UPG[k].max&&S.cash>=upCost(UPG,k,S.up[k])) return true;
  for(const k in AUTO) if(S.auto[k]<AUTO[k].max&&S.cash>=upCost(AUTO,k,S.auto[k])) return true;
  for(const k in HARD) if(!S.hard[k]&&S.cash>=HARD[k].cost) return true;
  if(canOpenRow(S.hall)&&S.cash>=rowCostOf(S.hall)) return true;
  const nx=nextHall();
  if(nx>=0&&S.cash>=HALLS[nx].cost) return true;
  return false;
}
/* Cards are built once per tab and then refreshed in place. Rebuilding the whole
   list on a timer threw the scroll position back to the top and swapped
   buttons out from under the player's finger. */
let listItems=[];
const listEl=$('dlist');
function renderList(){
  const keep=listEl.scrollTop;
  listItems=[]; listEl.innerHTML='';
  if(tab==='floor'){
    const hi=S.hall, H=HALLS[hi];
    listEl.appendChild(sechead('This hall'));
    if(!canOpenRow(hi))
      listEl.appendChild(card('🏢',H.name+' is full',()=>({desc:'Every tile in this hall is open.',btn:'Maxed',flat:true})));
    else
      listEl.appendChild(card('🏗️','Open the next row',()=>{
        const c=rowCostOf(hi);
        return {desc:`Row ${S.halls[hi].rows+1} of ${H.name} adds ${H.cols} more tiles.`,btn:money(c),can:S.cash>=c};
      },()=>{
        const c=rowCostOf(hi);
        if(!canOpenRow(hi)||S.cash<c) return;
        S.cash-=c; S.halls[hi].rows++;
        S.halls[hi].tiles.forEach(paint); recomputeFans(hi); sizeFloor();
        toast(`${H.name} row ${S.halls[hi].rows} open.`); save(); renderList();
      }));
    listEl.appendChild(sechead('Halls'));
    S.halls.forEach((hs,i)=>{
      const H2=HALLS[i];
      listEl.appendChild(card('🏬',H2.name,()=>{
        if(!hs.open) return {
          desc:`Another floor, ${H2.cols} by ${H2.rows}. Your other halls keep running while you are in it.`,
          btn:money(H2.cost), can:S.cash>=H2.cost};
        return {desc:`${H2.cols} by ${H2.rows}. ${machinesIn(i)} machines, ${hs.rows} of ${H2.rows} rows open.`,
                btn:i===S.hall?'You are here':'Go there', can:i!==S.hall, flat:i===S.hall};
      },()=>{
        if(hs.open){ if(i!==S.hall){ switchHall(i); closeDrawer(); } return; }
        if(S.cash<H2.cost) return;
        S.cash-=H2.cost; hs.open=1;
        buildHall(i); rebuildLive(); recomputeFans(i); buildHalls();
        switchHall(i); save();
        /* Buying a hall moves you into it, so get the drawer out of the way. */
        closeDrawer();
        toast(H2.name+' is open. Your other halls keep running.');
      }));
    });
    listEl.appendChild(sechead('Danger zone'));
    listEl.appendChild(card('🧨','Wipe save',()=>({desc:'Deletes progress and starts a fresh floor.',btn:'Wipe',can:true}),()=>{
      if(confirm('Delete your save and start over?')){ store.clear(); location.reload(); }
    }));
  }
  else if(tab==='hardware'){
    for(const k in HARD){
      const h=HARD[k];
      listEl.appendChild(card(ICON(k),h.name,()=>({
        desc:h.desc, btn:S.hard[k]?'Owned':money(h.cost),
        can:!S.hard[k]&&S.cash>=h.cost, flat:!!S.hard[k]
      }),()=>{
        if(S.hard[k]||S.cash<h.cost) return;
        S.cash-=h.cost; S.hard[k]=1; toast(h.name+' unlocked.'); paintTray(); save(); refreshList();
      }));
    }
    listEl.appendChild(sechead('On the floor'));
    for(const k in MACH){
      const m=MACH[k];
      listEl.appendChild(card(ICON(k),m.name,()=>{
        const lock=m.unlock&&!S.hard[m.unlock];
        return {desc:m.desc+(lock?'':` Next costs ${money(costOf(k))}.`),
                btn:lock?'Locked':`${S.counts[k]} built`, flat:true};
      }));
    }
  }
  else{
    const src=tab==='upgrades'?UPG:AUTO, box=tab==='upgrades'?S.up:S.auto;
    for(const k in src){
      const u=src[k];
      listEl.appendChild(card(upIcon(k),u.name,()=>{
        const lvl=box[k], maxed=lvl>=u.max, c=maxed?0:upCost(src,k,lvl);
        return {desc:u.desc(lvl), btn:maxed?'Maxed':money(c), can:!maxed&&S.cash>=c, lvl, flat:maxed};
      },()=>{
        const lvl=box[k];
        if(lvl>=u.max) return;
        const c=upCost(src,k,lvl);
        if(S.cash<c) return;
        S.cash-=c; box[k]++; save(); refreshList();
      }));
    }
  }
  listEl.scrollTop=keep;
}
function refreshList(){
  if(!drawer.classList.contains('open')) return;
  for(const up of listItems) up();
}
function sechead(txt){
  const d=document.createElement('div'); d.className='sechead'; d.textContent=txt; return d;
}
function upIcon(k){
  const m={density:'📈',bandwidth:'📡',buffer:'💾',cooling:'💧',thermal:'🧊',ambient:'🪟',power:'🔌',surge:'🎛️',
           contracts:'📝',override:'👆',bot:'🤖',reboot:'🛠️',shield:'🛡️',overflow:'🪣',night:'🌙'};
  return m[k]||'⭐';
}
/* state() returns {desc, btn, can, lvl, flat} and is re-read on every refresh. */
function card(ic,title,state,onBuy){
  const el=document.createElement('div'); el.className='card';
  el.innerHTML=`<div class="ic">${ic}</div><div class="mid">
    <div class="t"><span class="tt"></span></div>
    <div class="d"></div></div>`;
  const titleEl=el.querySelector('.t'), descEl=el.querySelector('.d');
  setText(el.querySelector('.tt'),title);
  const lvEl=document.createElement('span'); lvEl.className='lv';
  const b=document.createElement('button'); b.className='buy'; b.type='button';
  if(onBuy) b.addEventListener('click',()=>{ if(!b.disabled){ onBuy(); refreshList(); } });
  el.appendChild(b);
  const update=()=>{
    const st=state();
    setText(descEl,st.desc);
    setText(b,st.btn);
    b.disabled=!st.can;
    b.classList.toggle('max',!!st.flat);
    if(st.lvl){ setText(lvEl,'Lv '+st.lvl); if(!lvEl.parentNode) titleEl.appendChild(lvEl); }
    else if(lvEl.parentNode) lvEl.remove();
  };
  update(); listItems.push(update);
  return el;
}
setInterval(refreshList,300);

/* ================= boot ================= */
document.addEventListener('gesturestart',e=>e.preventDefault());
document.addEventListener('dblclick',e=>e.preventDefault());
/* rAF is frozen in a background tab, so a long stint away used to earn nothing at
   all unless the page was reloaded. Pay it out on the way back instead. */
let hiddenAt=0;
addEventListener('visibilitychange',()=>{
  if(document.hidden){ hiddenAt=Date.now(); cancelHold(); save(); return; }
  startLoop();
  if(!hiddenAt) return;
  const away=offlineEarnings(hiddenAt); hiddenAt=0;
  if(away>1){
    S.cash+=away; S.earned+=away; bumpWallet(); save();
    toast('While you were away: '+money(away));
  }
});
addEventListener('pagehide',save);

const savedAt=load();
rebuildLive();
S.halls.forEach((hs,i)=>{ if(hs.open){ buildHall(i); recomputeFans(i); } });
buildTray(); buildHalls();
S.halls[S.hall].tiles.forEach(paint);
paintTray(); sizeFloor();
$('savenote').textContent = store.ok
  ? 'Progress saves to this browser automatically.'
  : 'Saving is off here. Open the file in Safari to keep progress.';

const gained=offlineEarnings(savedAt);
if(gained>1){
  const mins=Math.round(Math.min((Date.now()-savedAt)/60000,480));
  const plural=(n,w)=>n+' '+w+(n===1?'':'s');
  $('mbody').textContent=`Your site kept running for ${mins<60?plural(mins,'minute'):plural(Math.round(mins/60),'hour')}.`;
  $('mbig').textContent=money(gained);
  $('modal').classList.add('open');
  $('mok').addEventListener('click',()=>{
    S.cash+=gained; S.earned+=gained;
    $('modal').classList.remove('open'); bumpWallet(); save();
  },{once:true});
}
startLoop();
})();
</script>
